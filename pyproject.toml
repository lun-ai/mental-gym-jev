[project]
name = "jev"
version = "0.1.0"
description = "Mental gym: build a Jev-style System One model from scratch"
requires-python = ">=3.12"
dependencies = ["torch", "transformers", "numpy"]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
