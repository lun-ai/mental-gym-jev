[project]
name = "topic"
version = "0.1.0"
description = "Mental gym: build TOPIC from scratch"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
